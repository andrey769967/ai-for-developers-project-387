# Локальный запуск демо одной командой: docker compose up --build
#
# Порт снаружи и внутри контейнера задаётся переменной PORT (по умолчанию 3000).
# Данные хранятся в памяти процесса: рестарт контейнера их сбрасывает.

services:
  app:
    build:
      context: .
    image: call-booking
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT ?? '3000') + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
