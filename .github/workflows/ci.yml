# Гейт для каждого pull request и каждого пуша в main: установка зависимостей,
# тесты и сборка теми же командами, что и локально. Деплоя здесь нет.
# Красный чек блокирует merge, если в защите ветки main включён
# required status check «CI / Проверка».

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Проверка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record verified head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          {
            printf 'expected=%s\n' "$EXPECTED_SHA"
            printf 'actual=%s\n' "$actual_sha"
          } > browser-sha.txt
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            printf 'SHA mismatch: %s != %s\n' "$actual_sha" "$EXPECTED_SHA" >&2
            exit 1
          fi
          printf 'Verified head SHA: %s\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Node 22 с кэшем npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Браузер для сквозного сценария
        run: npx playwright install --with-deps chromium

      - name: "Все проверки: тесты, сборка, браузерный сценарий"
        run: npm run check

      - name: Upload browser artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pr-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            browser-sha.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
