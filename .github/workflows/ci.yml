# Гейт для каждого pull request и каждого пуша в main: установка зависимостей,
# тесты и сборка теми же командами, что и локально. Деплоя здесь нет.
# Красный чек блокирует merge, если в защите ветки main включён
# required status check «CI / Проверка».

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Проверка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22 с кэшем npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Браузер для сквозного сценария
        run: npx playwright install --with-deps chromium

      - name: "Все проверки: тесты, сборка, браузерный сценарий"
        run: npm run check
