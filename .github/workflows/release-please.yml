# Release PR по conventional commits: на каждый push в main action обновляет
# (или создаёт) PR с версией и CHANGELOG. Merge этого PR — выпуск релиза.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
