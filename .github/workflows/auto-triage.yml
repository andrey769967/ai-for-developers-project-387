# Автотриаж новых обращений (issues). Отдельно от вызова агента из комментария.
# hexlet-check.yml не трогаем — он обязателен для Хекслета.

name: Auto-triage new issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage new issue
    # Только доверенные авторы. Боты и уже готовые тикеты (ready-for-agent) пропускаем.
    if: >-
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/deepseek-v4.1-flash' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare prompt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          mkdir -p .scratch
          {
            printf 'Issue to triage: #%s — %s\n' "$ISSUE_NUMBER" "$ISSUE_TITLE"
            printf 'Author: %s (trusted association required by the workflow)\n\n' "$ISSUE_AUTHOR"
            cat .github/agent/triage-prompt.md
          } > "$RUNNER_TEMP/prompt.md"

      - name: Install OpenCode
        run: npm install -g @opencode/cli

      - name: Run agent
        id: agent
        run: |
          set -uo pipefail
          opencode run --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/prompt.md")"

      - name: Report failure
        if: failure()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf '> *This was generated by AI during triage.*\n\n'
            printf '🤖 Автотриаж не завершился. Лог: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/failure.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/failure.md"
