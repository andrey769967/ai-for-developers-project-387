# Агент opencode по комментарию: напишите `/opencode <задача>` (или `/oc`) в issue,
# в PR или на строке диффа — workflow запустит opencode в раннере. Агент читает
# AGENTS.md, отвечает в треде, а если нужны правки: в issue создаёт ветку и PR,
# в PR коммитит в ту же ветку.
#
# Что нужно один раз настроить:
#   1. Установить GitHub App https://github.com/apps/opencode-agent на репозиторий
#      (через него action получает токен для комментариев и пуша).
#   2. Добавить секрет OPENCODE_API_KEY в Settings → Secrets and variables → Actions.
#   3. При желании задать переменную OPENCODE_MODEL (по умолчанию модель ниже).
#
# Права: id-token: write нужен для обмена OIDC-токена на токен приложения,
# contents: read — только на чтение при checkout. Пишет агент от имени приложения.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  # Один прогон на issue/PR: агент не должен править код параллельно с самим собой.
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Отсев до запуска раннера: нужен триггер в тексте и права на запись у автора.
    # CLI ищет триггер подстрокой без учёта регистра, но фильтр GitHub Actions
    # регистр различает — поэтому пишите триггер строчными буквами.
    if: |
      (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Любая модель вида provider/model; переменная репозитория переопределяет.
          model: ${{ vars.OPENCODE_MODEL || 'opencode/deepseek-v4.1-flash' }}
          # Набор команд задан явно; дублируется в фильтре job.if выше — менять вместе.
          mentions: /opencode,/oc
          # Явный запрет публикации сессии. Текущий CLI (1.19.x) переменную SHARE
          # не читает и сессии не шарит, значение оставлено на случай поддержки.
          share: false
